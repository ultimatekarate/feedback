[package]
name = "feedback"
version = "0.1.0"
edition = "2021"
description = "Agentic workflow stability governor using Volterra integral pressure analysis"

[[bin]]
name = "feedback-hook"
path = "src/bin/feedback_hook.rs"

[dependencies]
volterra-stability = { git = "https://github.com/ultimatekarate/volterra-stability" }
nalgebra = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
